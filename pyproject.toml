[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "one-pixel-attack-lab"
version = "1.0.0"
description = "A notebook-derived PyTorch One Pixel Attack with handwritten differential evolution"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3", "torchvision>=0.21,<1", "timm>=1.0,<2", "matplotlib>=3.8,<4"]

[project.scripts]
one-pixel = "one_pixel_attack.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
